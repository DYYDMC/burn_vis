<!doctype html>
<!--
  PROTOTYPE — throwaway. Do not build on this file.
  Question: "What should the kcal-burn-to-goal visualizer look like?"
  Plan: three structurally different variants on one page, switchable via ?variant=A|B|C
        and the floating bottom bar (or ← / → keys).
    A — Trend chart   (cumulative line plot, red dashed goal date + goal kcal)
    B — Melting fat   (a block of fat that shrinks as you burn; quick-add chips)
    C — Day grid      (calendar of days to the goal; today's target first; tap a day to log)
  State is in memory only (reload = reset to seed data). "Apple Health" sync is a FAKE stub.
  Run: double-click this file, or `python3 -m http.server` and open /prototype-burn-ui.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burn Goal Prototype</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f3f0;
    --surface-1: #fcfcfb;
    --surface-2: #efeee9;
    --border: #e2e0da;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #85837d;
    --series-1: #2a78d6;
    --series-1-wash: rgba(42,120,214,.10);
    --pace: #a9a79f;
    --goal: #e34948;
    --good: #008300;
    --warn: #b86e00;
    --seq-0: #efeee9; --seq-1: #cde2fb; --seq-2: #86b6ef; --seq-3: #3987e5; --seq-4: #1c5cab;
    --fat: #f7e4a4; --fat-edge: #e0c066; --fat-shade: #efd27f; --fat-marble: #fff4cf;
    --heat-a: rgba(235,104,52,.28); --heat-b: rgba(235,104,52,0);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #252523; --border: #34332f;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8d85;
      --series-1: #3987e5; --series-1-wash: rgba(57,135,229,.14); --pace: #6c6a63;
      --goal: #e66767; --good: #3fae3f; --warn: #e0a030;
      --seq-0: #252523; --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #86b6ef;
      --fat: #e9cf7f; --fat-edge: #c9a645; --fat-shade: #d9b95e; --fat-marble: #f6e3a8;
      --heat-a: rgba(217,89,38,.35); --heat-b: rgba(217,89,38,0);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #252523; --border: #34332f;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8d85;
    --series-1: #3987e5; --series-1-wash: rgba(57,135,229,.14); --pace: #6c6a63;
    --goal: #e66767; --good: #3fae3f; --warn: #e0a030;
    --seq-0: #252523; --seq-1: #184f95; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #86b6ef;
    --fat: #e9cf7f; --fat-edge: #c9a645; --fat-shade: #d9b95e; --fat-marble: #f6e3a8;
    --heat-a: rgba(217,89,38,.35); --heat-b: rgba(217,89,38,0);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--text-primary);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding-bottom: 96px; }
  button, input, select { font: inherit; color: inherit; }
  input, select { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; min-width: 0; }
  button { cursor: pointer; border: 1px solid var(--border); background: var(--surface-1); border-radius: 8px; padding: 7px 12px; }
  button.primary { background: var(--series-1); border-color: var(--series-1); color: #fff; font-weight: 600; }
  button.link { border: 0; background: none; padding: 0; color: var(--series-1); }
  .muted { color: var(--text-muted); }
  .secondary { color: var(--text-secondary); }
  .num { font-variant-numeric: tabular-nums; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }

  /* ---------- Variant A: Trend chart ---------- */
  .va { max-width: 1040px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; }
  .va header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .va h1 { margin: 0; font-size: 20px; }
  .va .tiles { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; }
  .va .tile .label { color: var(--text-secondary); font-size: 13px; }
  .va .tile .value { font-size: 26px; font-weight: 600; }
  .va .tile.hero .value { font-size: 48px; line-height: 1.1; }
  .va .status { font-size: 14px; margin-top: 4px; }
  .va .chart-wrap { position: relative; }
  .va svg text { fill: var(--text-muted); font-size: 11px; }
  .va .tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
             border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; display: none; }
  .va .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
  .va .legend i { display: inline-block; width: 18px; height: 0; vertical-align: middle; margin-right: 6px; border-top: 2px solid; }
  .va .bottom { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
  .va form { display: grid; gap: 8px; }
  .va table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .va th, .va td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .va td.r, .va th.r { text-align: right; }
  .va .log { max-height: 320px; overflow: auto; }
  @media (max-width: 760px) {
    .va .tiles { grid-template-columns: 1fr 1fr; } .va .tile.hero { grid-column: 1 / -1; }
    .va .bottom { grid-template-columns: 1fr; }
  }

  /* ---------- Variant B: Melting fat ---------- */
  .vb { display: flex; flex-direction: column; align-items: center; padding: 20px 16px; }
  .vb #vb-fat { width: min(420px, 100%); background: radial-gradient(ellipse 60% 22% at 50% 90%, var(--heat-a), var(--heat-b) 75%); }
  .vb .top { width: 100%; max-width: 560px; display: flex; justify-content: space-between; align-items: center; }
  .vb .count { text-align: center; margin-top: 8px; }
  .vb .count .big { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
  .vb .count .sub { color: var(--text-secondary); margin-top: 6px; }
  .vb svg { width: min(420px, 100%); height: auto; display: block; }
  .vb .facts { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; color: var(--text-secondary); font-size: 14px; }
  .vb .facts b { color: var(--text-primary); font-size: 18px; display: block; text-align: center; }
  .vb .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 560px; margin-top: 18px; }
  .vb .chips button { border-radius: 999px; padding: 10px 14px; background: var(--surface-1); }
  .vb .chips button:active { transform: scale(.96); }
  .vb .custom { display: flex; gap: 8px; margin-top: 10px; justify-content: center; flex-wrap: wrap; }
  .vb .custom input { width: 110px; }
  .vb .last { margin-top: 12px; font-size: 13px; color: var(--text-muted); text-align: center; }
  .drip { transform-box: fill-box; transform-origin: 50% 0; animation: drip 2.6s ease-in-out infinite; }
  .drop { transform-box: fill-box; animation: fall 2.2s ease-in infinite; }
  @keyframes drip { 0%,100% { transform: scaleY(.55); } 50% { transform: scaleY(1.15); } }
  @keyframes fall { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(var(--fall, 60px)); opacity: 0; } }
  .vb .toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: var(--text-primary); color: var(--surface-1);
               padding: 8px 14px; border-radius: 999px; font-weight: 600; opacity: 0; transition: opacity .3s; pointer-events: none; }

  /* ---------- Variant C: Day grid ---------- */
  .vc { max-width: 560px; margin: 0 auto; padding: 20px 16px; display: grid; gap: 14px; }
  .vc .today .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .vc .today .big { font-size: 40px; font-weight: 700; }
  .vc .meter { height: 10px; background: var(--seq-1); border-radius: 999px; overflow: hidden; margin: 10px 0 6px; }
  .vc .meter > div { height: 100%; background: var(--series-1); border-radius: 999px; }
  .vc .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .vc .dow { font-size: 11px; color: var(--text-muted); text-align: center; }
  .vc .cell { aspect-ratio: 1; border-radius: 8px; padding: 4px; font-size: 11px; display: flex; flex-direction: column;
              justify-content: space-between; border: 2px solid transparent; position: relative; cursor: default; background: transparent; text-align: left; }
  .vc .cell.past, .vc .cell.isToday { cursor: pointer; }
  .vc .cell.future { border: 1px dashed var(--border); color: var(--text-muted); }
  .vc .cell.isToday { border-color: var(--text-primary); }
  .vc .cell.goal { border: 2px solid var(--goal); }
  .vc .cell.sel { outline: 3px solid var(--series-1); outline-offset: 1px; }
  .vc .cell .d { font-weight: 600; }
  .vc .cell .k { font-variant-numeric: tabular-nums; }
  .vc .legend { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--text-secondary); flex-wrap: wrap; }
  .vc .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .vc .legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .vc .day form { display: grid; grid-template-columns: 1fr 90px auto; gap: 8px; margin-top: 10px; }
  .vc .day ul { list-style: none; padding: 0; margin: 8px 0 0; }
  .vc .day li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; }

  /* ---------- Shared: settings dialog ---------- */
  dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--surface-1); color: var(--text-primary); padding: 20px; width: min(360px, calc(100vw - 32px)); }
  dialog form { display: grid; gap: 10px; }
  dialog label { display: grid; gap: 4px; font-size: 13px; color: var(--text-secondary); }

  /* ---------- Prototype switcher (not part of any design) ---------- */
  #proto-bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 1000;
               display: flex; align-items: center; gap: 4px; background: #111; color: #fff; border-radius: 999px;
               padding: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.35); font: 600 13px/1 ui-monospace, Menlo, monospace; }
  #proto-bar button { background: transparent; border: 0; color: #fff; padding: 8px 12px; border-radius: 999px; }
  #proto-bar button:hover { background: #333; }
  #proto-bar .label { padding: 0 8px; min-width: 150px; text-align: center; white-space: nowrap; }
  #proto-bar button { white-space: nowrap; }
  #proto-state { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); z-index: 1000; display: none;
                 background: #111; color: #9fe39f; font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 12px 14px;
                 border-radius: 12px; max-height: 50vh; overflow: auto; width: min(460px, calc(100vw - 32px)); white-space: pre; }
</style>
</head>
<body>
<div id="app"></div>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <strong>Goal</strong>
    <label>Start date <input type="date" name="startDate" required></label>
    <label>Goal date <input type="date" name="goalDate" required></label>
    <label>Goal kcal to burn <input type="number" name="goalKcal" min="1" step="10" required></label>
    <div style="display:flex; gap:8px; justify-content:flex-end">
      <button value="cancel" formnovalidate>Cancel</button>
      <button class="primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<div id="proto-state"></div>
<div id="proto-bar">
  <button id="pb-prev" title="Previous variant (←)">←</button>
  <span class="label" id="pb-label"></span>
  <button id="pb-next" title="Next variant (→)">→</button>
  <button id="pb-state" title="Show in-memory state">{ }</button>
</div>

<script>
// ================= State (in memory only) =================
const DAY = 864e5;
const pad = n => String(n).padStart(2, '0');
const toUTC = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const fromUTC = t => new Date(t).toISOString().slice(0, 10);
const addDays = (s, n) => fromUTC(toUTC(s) + n * DAY);
const diffDays = (a, b) => Math.round((toUTC(b) - toUTC(a)) / DAY);
const TODAY = (() => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; })();
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = s => { const d = new Date(toUTC(s)); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const fmt = n => Math.round(n).toLocaleString('en-US');
const KCAL_PER_KG_FAT = 7700;

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const ACTIVITIES = ['Run', 'Walk', 'Cycling', 'Gym', 'Swim', 'HIIT'];
let nextId = 1;
function seedEntries(start) {
  const r = rng(42), out = [];
  for (let d = start; d < TODAY; d = addDays(d, 1)) {
    if (r() < 0.6) out.push({ id: nextId++, date: d, activity: ACTIVITIES[Math.floor(r() * ACTIVITIES.length)],
                              kcal: Math.round(100 + r() * 230), source: 'manual' });
  }
  return out;
}

const S = { startDate: '2026-10-01', goalDate: '2026-11-30', goalKcal: 9240, entries: [] };
S.entries = seedEntries(S.startDate);

function derive() {
  const inRange = S.entries.filter(e => e.date >= S.startDate && e.date <= S.goalDate);
  const byDay = {};
  for (const e of inRange) byDay[e.date] = (byDay[e.date] || 0) + e.kcal;
  const burned = inRange.reduce((a, e) => a + e.kcal, 0);
  const left = Math.max(0, S.goalKcal - burned);
  const totalDays = diffDays(S.startDate, S.goalDate) + 1;
  const daysDone = Math.max(0, Math.min(totalDays, diffDays(S.startDate, TODAY)));   // full days before today
  const daysLeft = Math.max(0, diffDays(TODAY, S.goalDate) + 1);                       // incl. today
  const pace = S.goalKcal / totalDays;                                                  // original plan, kcal/day
  const neededPerDay = daysLeft ? left / daysLeft : left;
  const expected = pace * daysDone;
  const delta = burned - expected;                                                      // + ahead, - behind
  const avg = daysDone ? burned / daysDone : 0;
  const projected = burned + avg * daysLeft;
  const finishDate = avg > 0 ? addDays(TODAY, Math.ceil(left / avg)) : null;
  const todayBurned = byDay[TODAY] || 0;
  return { byDay, burned, left, totalDays, daysDone, daysLeft, pace, neededPerDay, expected, delta, avg, projected, finishDate, todayBurned };
}

function addEntry(e) { S.entries.push({ id: nextId++, source: 'manual', ...e }); render(); }
function removeEntry(id) { S.entries = S.entries.filter(e => e.id !== id); render(); }

// FAKE Apple Health sync: invents Watch workouts for empty days. Real HealthKit is not reachable from a web page.
function fakeHealthSync() {
  const r = rng(Date.now() % 100000), have = new Set(S.entries.map(e => e.date));
  let added = 0;
  for (let d = S.startDate; d <= TODAY && d <= S.goalDate; d = addDays(d, 1)) {
    if (!have.has(d) && r() < 0.55) {
      S.entries.push({ id: nextId++, date: d, activity: 'Watch workout', kcal: Math.round(90 + r() * 260), source: 'health' });
      added++;
    }
  }
  render();
  return added;
}

const statusText = D => D.delta >= 0
  ? { icon: '▲', cls: 'good', text: `${fmt(D.delta)} kcal ahead of pace` }
  : { icon: '▼', cls: 'warn', text: `${fmt(-D.delta)} kcal behind pace` };

function openSettings() {
  const dlg = document.getElementById('settings'), f = document.getElementById('settings-form');
  f.startDate.value = S.startDate; f.goalDate.value = S.goalDate; f.goalKcal.value = S.goalKcal;
  dlg.returnValue = '';
  dlg.onclose = () => {
    if (dlg.returnValue !== 'save') return;
    S.startDate = f.startDate.value; S.goalDate = f.goalDate.value; S.goalKcal = Number(f.goalKcal.value);
    render();
  };
  dlg.showModal();
}

// ================= Variant A — Trend chart =================
function VariantA(D) {
  const st = statusText(D);
  const rows = [...S.entries].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  return `
  <div class="va">
    <header>
      <h1>Burn goal · ${fmt(S.goalKcal)} kcal by ${fmtDate(S.goalDate)}</h1>
      <button class="link" data-act="settings">Edit goal</button>
    </header>
    <div class="tiles">
      <div class="card tile hero"><div class="label">Left to burn</div><div class="value num">${fmt(D.left)} kcal</div>
        <div class="status" style="color:var(--${st.cls})">${st.icon} <span style="color:var(--text-secondary)">${st.text}</span></div></div>
      <div class="card tile"><div class="label">Burned</div><div class="value num">${fmt(D.burned)}</div><div class="muted">${Math.round(D.burned / S.goalKcal * 100)}% of goal</div></div>
      <div class="card tile"><div class="label">Days left</div><div class="value num">${D.daysLeft}</div><div class="muted">incl. today</div></div>
      <div class="card tile"><div class="label">Needed per day</div><div class="value num">${fmt(D.neededPerDay)}</div><div class="muted">plan was ${fmt(D.pace)}/day</div></div>
    </div>
    <div class="card">
      <div class="chart-wrap" id="va-chart"></div>
      <div class="legend">
        <span><i style="border-color:var(--series-1)"></i>Burned (cumulative)</span>
        <span><i style="border-color:var(--pace); border-top-style:dotted"></i>Planned pace</span>
        <span><i style="border-color:var(--series-1); border-top-style:dashed; opacity:.55"></i>Projection at your average</span>
        <span><i style="border-color:var(--goal); border-top-style:dashed"></i>Goal date &amp; kcal</span>
      </div>
    </div>
    <div class="bottom">
      <div class="card">
        <form id="va-form">
          <strong>Log a burn</strong>
          <input type="date" name="date" value="${TODAY}" max="${TODAY}" required>
          <select name="activity">${ACTIVITIES.map(a => `<option>${a}</option>`).join('')}<option>Other</option></select>
          <input type="number" name="kcal" placeholder="kcal" min="1" required>
          <button class="primary">Add</button>
          <button type="button" data-act="health">Sync from Apple Health (fake)</button>
        </form>
      </div>
      <div class="card log">
        <table><thead><tr><th>Date</th><th>Activity</th><th class="r">kcal</th><th>Source</th><th></th></tr></thead>
        <tbody>${rows.map(e => `<tr><td>${fmtDate(e.date)}</td><td>${e.activity}</td><td class="r num">${fmt(e.kcal)}</td>
          <td class="muted">${e.source === 'health' ? 'Health' : 'manual'}</td>
          <td class="r"><button class="link" data-del="${e.id}" title="Delete">✕</button></td></tr>`).join('')}</tbody></table>
      </div>
    </div>
  </div>`;
}

function niceStep(max, n = 5) { const raw = max / n, p = 10 ** Math.floor(Math.log10(raw)), m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
const compact = v => v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'K' : String(v);

function mountA(D) {
  const wrap = document.getElementById('va-chart');
  const W = wrap.clientWidth, H = Math.max(260, Math.min(420, W * 0.5));
  const P = { l: 44, r: 16, t: 28, b: 28 }, w = W - P.l - P.r, h = H - P.t - P.b;
  const span = D.totalDays + 2;
  const x = d => P.l + diffDays(S.startDate, d) / span * w;
  const yMax = Math.max(S.goalKcal, D.projected) * 1.08, step = niceStep(yMax);
  const y = v => P.t + h - v / yMax * h;

  const lastDay = TODAY < S.goalDate ? TODAY : S.goalDate;
  const pts = []; let cum = 0;
  for (let d = S.startDate; d <= lastDay; d = addDays(d, 1)) { cum += D.byDay[d] || 0; pts.push({ d, cum, day: D.byDay[d] || 0 }); }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.d).toFixed(1)},${y(p.cum).toFixed(1)}`).join('');
  const area = pts.length ? `${line}L${x(pts.at(-1).d)},${y(0)}L${x(pts[0].d)},${y(0)}Z` : '';
  const last = pts.at(-1);

  let grid = '';
  for (let v = 0; v <= yMax; v += step) grid += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`;
  let xt = '';
  for (let i = 0; i <= span; i += 7) { const d = addDays(S.startDate, i); xt += `<text x="${x(d)}" y="${H - 8}" text-anchor="middle">${fmtDate(d)}</text>`; }

  const gx = x(S.goalDate), gy = y(S.goalKcal);
  wrap.innerHTML = `
  <svg width="${W}" height="${H}" role="img" aria-label="Cumulative kcal burned vs goal">
    ${grid}${xt}
    <line x1="${x(S.startDate)}" y1="${y(D.pace)}" x2="${gx}" y2="${gy}" stroke="var(--pace)" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
    ${last && TODAY < S.goalDate ? `<line x1="${x(last.d)}" y1="${y(last.cum)}" x2="${gx}" y2="${y(D.projected)}" stroke="var(--series-1)" stroke-opacity=".55" stroke-width="2" stroke-dasharray="6 5"/>` : ''}
    <line x1="${P.l}" x2="${W - P.r}" y1="${gy}" y2="${gy}" stroke="var(--goal)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <line x1="${gx}" x2="${gx}" y1="${P.t - 8}" y2="${P.t + h}" stroke="var(--goal)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="${gx - 6}" y="${gy - 8}" text-anchor="end" style="fill:var(--text-primary);font-weight:600">Goal · ${fmt(S.goalKcal)} kcal · ${fmtDate(S.goalDate)}</text>
    <line x1="${x(TODAY)}" x2="${x(TODAY)}" y1="${P.t}" y2="${P.t + h}" stroke="var(--text-muted)" stroke-width="1"/>
    <text x="${x(TODAY)}" y="${P.t - 10}" text-anchor="middle">Today</text>
    <path d="${area}" fill="var(--series-1-wash)"/>
    <path d="${line}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${last ? `<circle cx="${x(last.d)}" cy="${y(last.cum)}" r="5" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"/>
      <text x="${x(last.d) + 9}" y="${y(last.cum) + 4}" style="fill:var(--text-primary);font-weight:600">${fmt(last.cum)}</text>` : ''}
    <line id="va-x" y1="${P.t}" y2="${P.t + h}" stroke="var(--text-muted)" stroke-width="1" visibility="hidden"/>
    <circle id="va-dot" r="5" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2" visibility="hidden"/>
    <rect id="va-hit" x="${P.l}" y="${P.t}" width="${w}" height="${h}" fill="transparent"/>
  </svg><div class="tip" id="va-tip"></div>`;

  const hit = document.getElementById('va-hit'), xl = document.getElementById('va-x'), dot = document.getElementById('va-dot'), tip = document.getElementById('va-tip');
  hit.onmousemove = ev => {
    const mx = ev.clientX - wrap.getBoundingClientRect().left;
    const i = Math.round((mx - P.l) / w * span), d = addDays(S.startDate, Math.max(0, Math.min(D.totalDays - 1, i)));
    const p = pts.find(p => p.d === d), px = x(d);
    xl.setAttribute('x1', px); xl.setAttribute('x2', px); xl.setAttribute('visibility', 'visible');
    if (p) { dot.setAttribute('cx', px); dot.setAttribute('cy', y(p.cum)); dot.setAttribute('visibility', 'visible'); } else dot.setAttribute('visibility', 'hidden');
    const plan = D.pace * (diffDays(S.startDate, d) + 1);
    tip.innerHTML = `<b>${fmtDate(d)}</b><br>` + (p ? `That day: <b class="num">${fmt(p.day)}</b> kcal<br>Total: <b class="num">${fmt(p.cum)}</b> kcal<br>` : `<span class="muted">future</span><br>`) +
      `<span class="muted">Plan: ${fmt(plan)} kcal</span>`;
    tip.style.display = 'block';
    tip.style.left = Math.min(px + 12, W - tip.offsetWidth - 4) + 'px'; tip.style.top = (P.t + 8) + 'px';
  };
  hit.onmouseleave = () => { xl.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; };

  document.getElementById('va-form').onsubmit = ev => {
    ev.preventDefault(); const f = ev.target;
    addEntry({ date: f.date.value, activity: f.activity.value, kcal: Number(f.kcal.value) });
  };
}

// ================= Variant B — Melting fat block =================
const QUICK = [
  { label: '🚶 Walk 30 min', activity: 'Walk', kcal: 120 },
  { label: '🏃 Run 30 min', activity: 'Run', kcal: 300 },
  { label: '🚴 Ride 45 min', activity: 'Cycling', kcal: 350 },
  { label: '🏋️ Gym 60 min', activity: 'Gym', kcal: 250 },
  { label: '🏊 Swim 30 min', activity: 'Swim', kcal: 260 },
];
let bShown = null;   // displayed "left" value, tweened toward target

function fatSVG(left) {
  const frac = Math.max(0, Math.min(1, left / S.goalKcal));
  const G = 330, W = 210, x0 = 180 - W / 2, x1 = 180 + W / 2, maxH = 240;
  const h = Math.max(0, maxH * frac), top = G - h, r = Math.min(26, h / 2);
  const melt = 1 - frac;
  const puddleRx = 70 + 120 * melt, puddleRy = 8 + 10 * melt;
  // bottom of the block flares out a bit as it melts
  const flare = 6 + 22 * melt;
  const body = h > 1 ? `M${x0 - flare},${G} C${x0},${G - 4} ${x0},${G - 18} ${x0},${Math.max(top + r, G - 18)}
    L${x0},${top + r} Q${x0},${top} ${x0 + r},${top} L${x1 - r},${top} Q${x1},${top} ${x1},${top + r}
    L${x1},${Math.max(top + r, G - 18)} C${x1},${G - 18} ${x1},${G - 4} ${x1 + flare},${G} Z` : '';
  const face = h > 70 ? (() => {
    const fy = top + Math.min(70, h * 0.35), worried = melt > 0.5;
    return `<circle cx="150" cy="${fy}" r="6" fill="#3a2f12"/><circle cx="210" cy="${fy}" r="6" fill="#3a2f12"/>
      ${worried ? `<path d="M164,${fy + 26} q16,-12 32,0" stroke="#3a2f12" stroke-width="3" fill="none" stroke-linecap="round"/>`
                : `<path d="M164,${fy + 18} q16,12 32,0" stroke="#3a2f12" stroke-width="3" fill="none" stroke-linecap="round"/>`}
      <path class="drop" style="--fall:${h * 0.5}px" d="M${x1 - 18},${fy - 14} q5,9 0,13 q-5,-4 0,-13Z" fill="#7cc0f0"/>`;
  })() : '';
  const drips = h > 40 ? [0.22, 0.55, 0.8].map((p, i) => {
    const dx = x0 + W * p, len = 18 + 26 * melt + i * 6;
    return `<path class="drip" style="animation-delay:${i * 0.7}s" d="M${dx - 7},${top + 2} L${dx + 7},${top + 2} L${dx + 5},${top + len} a5,5 0 0 1 -10,0 Z" fill="var(--fat-shade)"/>`;
  }).join('') : '';
  const falling = h > 10 ? [x0 - flare + 4, x1 + flare - 4].map((dx, i) =>
    `<circle class="drop" style="--fall:24px; animation-delay:${i * 1.1}s" cx="${dx + (i ? 6 : -6)}" cy="${G - 26}" r="4" fill="var(--fat-shade)"/>`).join('') : '';
  return `
  <svg viewBox="0 0 360 350" role="img" aria-label="${fmt(left)} kcal of fat left">
    <defs><clipPath id="fatclip"><path d="${body}"/></clipPath></defs>
    <rect x="${x0}" y="${G - maxH}" width="${W}" height="${maxH}" rx="26" fill="none" stroke="var(--fat-edge)" stroke-width="1.5" stroke-dasharray="4 6" opacity=".6"/>
    <text x="${x1 + 8}" y="${G - maxH + 12}" style="font-size:11px;fill:var(--text-muted)">${fmt(S.goalKcal)}</text>
    <ellipse cx="180" cy="${G + 2}" rx="${puddleRx}" ry="${puddleRy}" fill="var(--fat)" opacity=".85"/>
    <ellipse cx="180" cy="${G}" rx="${puddleRx * 0.6}" ry="${puddleRy * 0.45}" fill="var(--fat-marble)" opacity=".7"/>
    ${body ? `<path d="${body}" fill="var(--fat)" stroke="var(--fat-edge)" stroke-width="2"/>
    <g clip-path="url(#fatclip)" fill="none" stroke="var(--fat-marble)" stroke-width="7" stroke-linecap="round" opacity=".9">
      <path d="M${x0 - 10},${G - 60} q50,-30 100,-6 t130,-20"/>
      <path d="M${x0 - 10},${G - 150} q60,20 110,-10 t120,8"/>
      <rect x="${x1 - 26}" y="${top}" width="26" height="${h}" fill="var(--fat-shade)" stroke="none" opacity=".55"/>
    </g>${drips}${falling}${face}` : `<text x="180" y="${G - 40}" text-anchor="middle" style="font-size:22px;font-weight:700;fill:var(--text-primary)">All melted! 🎉</text>`}
  </svg>`;
}

function VariantB(D) {
  const last = [...S.entries].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id)[0];
  return `
  <div class="vb">
    <div class="top"><span class="muted">${fmtDate(S.startDate)} → ${fmtDate(S.goalDate)}</span><button class="link" data-act="settings">Goal</button></div>
    <div class="count"><div class="big num" id="vb-num">${fmt(bShown ?? D.left)}</div>
      <div class="sub">kcal of fat left to melt · ≈ ${(D.left / KCAL_PER_KG_FAT).toFixed(2)} kg</div></div>
    <div id="vb-fat">${fatSVG(bShown ?? D.left)}</div>
    <div class="facts">
      <div><b class="num">${D.daysLeft}</b>days left</div>
      <div><b class="num">${fmt(D.neededPerDay)}</b>kcal / day</div>
      <div><b class="num">${fmt(D.todayBurned)}</b>burned today</div>
    </div>
    <div class="chips">${QUICK.map((q, i) => `<button data-quick="${i}">${q.label} · ${q.kcal}</button>`).join('')}</div>
    <form class="custom" id="vb-form">
      <input type="number" name="kcal" placeholder="other kcal" min="1" required>
      <button class="primary">Melt it</button>
      <button type="button" data-act="health">Sync Health (fake)</button>
    </form>
    <div class="last">${last ? `Last: ${last.activity} · ${fmt(last.kcal)} kcal · ${fmtDate(last.date)}` : 'Nothing logged yet'}</div>
    <div class="toast" id="vb-toast"></div>
  </div>`;
}

function mountB(D) {
  const target = D.left;
  if (bShown === null) bShown = target;
  const from = bShown, t0 = performance.now(), dur = 1100;
  const tick = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - (1 - k) ** 3;
    bShown = from + (target - from) * e;
    const fat = document.getElementById('vb-fat'), num = document.getElementById('vb-num');
    if (!fat) return;  // switched away mid-animation
    fat.innerHTML = fatSVG(bShown); num.textContent = fmt(bShown);
    if (k < 1) requestAnimationFrame(tick);
  };
  if (from !== target) requestAnimationFrame(tick);
  const toast = msg => { const t = document.getElementById('vb-toast'); t.textContent = msg; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 1400); };
  document.querySelectorAll('[data-quick]').forEach(b => b.onclick = () => {
    const q = QUICK[b.dataset.quick]; addEntry({ date: TODAY, activity: q.activity, kcal: q.kcal }); toast(`−${q.kcal} kcal 🔥`);
  });
  document.getElementById('vb-form').onsubmit = ev => {
    ev.preventDefault(); const k = Number(ev.target.kcal.value);
    addEntry({ date: TODAY, activity: 'Other', kcal: k }); toast(`−${k} kcal 🔥`);
  };
}

// ================= Variant C — Day grid =================
let cSelected = TODAY;
function seqVar(ratio, has) {
  if (!has) return 'var(--seq-0)';
  return ratio < 0.5 ? 'var(--seq-1)' : ratio < 1 ? 'var(--seq-2)' : ratio < 1.5 ? 'var(--seq-3)' : 'var(--seq-4)';
}
function VariantC(D) {
  const st = statusText(D);
  const todayPct = D.neededPerDay ? Math.min(100, D.todayBurned / D.neededPerDay * 100) : 100;
  // weeks Mon..Sun covering start..goal
  const startDow = (new Date(toUTC(S.startDate)).getUTCDay() + 6) % 7;
  const gridStart = addDays(S.startDate, -startDow);
  const cells = [];
  for (let d = gridStart; d <= S.goalDate || (diffDays(gridStart, d) % 7); d = addDays(d, 1)) {
    if (d < S.startDate || d > S.goalDate) { cells.push(`<div></div>`); continue; }
    const burned = D.byDay[d] || 0, past = d < TODAY, isToday = d === TODAY, future = d > TODAY;
    const ratio = burned / D.pace, bg = future ? 'transparent' : seqVar(ratio, burned > 0);
    const dark = !future && burned > 0 && ratio >= 1;
    const dd = new Date(toUTC(d)).getUTCDate();
    cells.push(`<button class="cell ${past ? 'past' : ''} ${isToday ? 'isToday' : ''} ${future ? 'future' : ''} ${d === S.goalDate ? 'goal' : ''} ${d === cSelected ? 'sel' : ''}"
      ${future ? 'disabled' : `data-day="${d}"`} style="background:${bg}; ${dark ? 'color:#fff' : ''}" title="${fmtDate(d)}: ${fmt(burned)} kcal">
      <span class="d">${dd === 1 ? MON[new Date(toUTC(d)).getUTCMonth()] + ' ' : ''}${dd}${d === S.goalDate ? ' 🏁' : ''}</span>
      <span class="k">${future ? fmt(D.neededPerDay) : burned ? fmt(burned) : '–'}</span></button>`);
  }
  const selEntries = S.entries.filter(e => e.date === cSelected);
  return `
  <div class="vc">
    <div class="card today">
      <div class="row"><span class="secondary">Today · ${fmtDate(TODAY)}</span><button class="link" data-act="settings">Goal</button></div>
      <div class="row"><span class="big num">${fmt(D.todayBurned)} <span class="muted" style="font-size:20px;font-weight:500">/ ${fmt(D.neededPerDay)} kcal</span></span></div>
      <div class="meter"><div style="width:${todayPct}%"></div></div>
      <div class="row" style="font-size:14px"><span style="color:var(--${st.cls})">${st.icon} <span class="secondary">${st.text}</span></span>
        <span class="secondary num">${fmt(D.left)} left · ${D.daysLeft} days</span></div>
    </div>
    <div class="card">
      <div class="grid">${['M','T','W','T','F','S','S'].map(x => `<div class="dow">${x}</div>`).join('')}${cells.join('')}</div>
      <div class="legend" style="margin-top:10px">
        <span>vs plan of ${fmt(D.pace)}/day:</span>
        <span><i style="background:var(--seq-0)"></i>none</span><span><i style="background:var(--seq-1)"></i>&lt;50%</span>
        <span><i style="background:var(--seq-2)"></i>&lt;100%</span><span><i style="background:var(--seq-3)"></i>hit</span>
        <span><i style="background:var(--seq-4)"></i>150%+</span><span><i style="border:1px dashed var(--border)"></i>needed/day</span>
      </div>
    </div>
    <div class="card day">
      <strong>${cSelected === TODAY ? 'Today' : fmtDate(cSelected)}</strong> <span class="muted">· ${fmt(D.byDay[cSelected] || 0)} kcal</span>
      <ul>${selEntries.map(e => `<li><span>${e.activity} <span class="muted">${e.source === 'health' ? '· Health' : ''}</span></span>
        <span class="num">${fmt(e.kcal)} <button class="link" data-del="${e.id}">✕</button></span></li>`).join('') || '<li class="muted">No activity logged</li>'}</ul>
      <form id="vc-form">
        <select name="activity">${ACTIVITIES.map(a => `<option>${a}</option>`).join('')}</select>
        <input type="number" name="kcal" placeholder="kcal" min="1" required>
        <button class="primary">Add</button>
      </form>
      <div style="margin-top:10px"><button data-act="health">Sync from Apple Health (fake)</button></div>
    </div>
  </div>`;
}
function mountC() {
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { cSelected = b.dataset.day; render(); });
  document.getElementById('vc-form').onsubmit = ev => {
    ev.preventDefault(); const f = ev.target;
    addEntry({ date: cSelected, activity: f.activity.value, kcal: Number(f.kcal.value) });
  };
}

// ================= Switcher + render =================
const VARIANTS = [
  { key: 'A', name: 'Trend chart', view: VariantA, mount: mountA },
  { key: 'B', name: 'Melting fat', view: VariantB, mount: mountB },
  { key: 'C', name: 'Day grid', view: VariantC, mount: mountC },
];
let current = (new URLSearchParams(location.search).get('variant') || 'A').toUpperCase();
if (!VARIANTS.some(v => v.key === current)) current = 'A';

function setVariant(key) {
  current = key;
  const u = new URL(location.href); u.searchParams.set('variant', key);
  try { history.replaceState(null, '', u); } catch { /* file:// in some browsers */ }
  render();
}
function cycle(dir) { const i = VARIANTS.findIndex(v => v.key === current); setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key); }

function render() {
  const D = derive(), V = VARIANTS.find(v => v.key === current);
  document.getElementById('app').innerHTML = V.view(D);
  V.mount(D);
  document.querySelectorAll('[data-act="settings"]').forEach(b => b.onclick = openSettings);
  document.querySelectorAll('[data-act="health"]').forEach(b => b.onclick = () => { const n = fakeHealthSync(); console.log(`fake Health sync added ${n}`); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => removeEntry(Number(b.dataset.del)));
  document.getElementById('pb-label').textContent = `${V.key} (${V.name})`;
  const { byDay, ...rest } = D;
  document.getElementById('proto-state').textContent = JSON.stringify({
    variant: current, today: TODAY,
    settings: { startDate: S.startDate, goalDate: S.goalDate, goalKcal: S.goalKcal },
    derived: Object.fromEntries(Object.entries(rest).map(([k, v]) => [k, typeof v === 'number' ? Math.round(v) : v])),
    entries: S.entries.length, lastEntries: S.entries.slice(-5),
  }, null, 2);
}

document.getElementById('pb-prev').onclick = () => cycle(-1);
document.getElementById('pb-next').onclick = () => cycle(1);
document.getElementById('pb-state').onclick = () => { const p = document.getElementById('proto-state'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; };
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
  if (document.querySelector('dialog[open]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => current === 'A' && mountA(derive()), 120); });
render();
</script>
</body>
</html>
