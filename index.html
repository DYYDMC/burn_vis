<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Burn Goal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <div class="top">
    <span id="range" class="muted"></span>
    <div class="top-actions">
      <label class="lang"><span id="lang-flag" aria-hidden="true"></span><select id="lang" data-i18n-aria-label="language"></select></label>
      <button class="link" id="open-settings" data-i18n="goal">Goal</button>
    </div>
  </div>

  <section class="count">
    <div class="big num" id="left-num"></div>
    <div class="sub" id="left-sub"></div>
    <div id="status" class="status"></div>
  </section>

  <div id="fat" class="fat"></div>

  <div class="facts">
    <div><b class="num" id="days-left"></b><span data-i18n="daysLeft">days left</span></div>
    <div><b class="num" id="per-day"></b><span data-i18n="perDay">kcal / day</span></div>
    <div><b class="num" id="today-kcal"></b><span data-i18n="burnedToday">burned today</span></div>
  </div>

  <div class="chips" id="chips"></div>
  <form class="custom" id="custom-form">
    <input type="number" name="kcal" placeholder="+ kcal burned" min="1" inputmode="numeric" required aria-label="Add kcal burned by hand"
           data-i18n-placeholder="addPlaceholder" data-i18n-aria-label="addLabel">
    <button class="primary" data-i18n="meltIt">Melt it</button>
  </form>
  <p class="sync muted" id="sync-info"></p>

  <section class="card">
    <h2 data-i18n="progress">Progress</h2>
    <div class="chart-wrap" id="chart"></div>
    <div class="legend">
      <span><i class="key burned"></i><span data-i18n="legendBurned">Burned (cumulative)</span></span>
      <span><i class="key pace"></i><span data-i18n="legendPace">Planned pace</span></span>
      <span><i class="key projection"></i><span data-i18n="legendProjection">Projection at your average</span></span>
      <span><i class="key goal"></i><span data-i18n="legendGoal">Goal date &amp; kcal</span></span>
    </div>
  </section>

  <details class="card history">
    <summary data-i18n="history">History</summary>
    <ul id="history"></ul>
  </details>
</main>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <strong data-i18n="goal">Goal</strong>
    <label><span data-i18n="startDate">Start date</span> <input type="date" name="startDate" required></label>
    <label><span data-i18n="goalDate">Goal date</span> <input type="date" name="goalDate" required></label>
    <label><span data-i18n="goalKcal">Goal kcal to burn</span> <input type="number" name="goalKcal" min="1" step="1" required></label>
    <div class="actions">
      <button value="cancel" formnovalidate data-i18n="cancel">Cancel</button>
      <button class="primary" value="save" data-i18n="save">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="src/app.js"></script>
</body>
</html>
